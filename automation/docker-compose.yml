services:
  taxsarthi-automation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taxsarthi-automation
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - TARGET_REPO=${TARGET_REPO:-https://github.com/karanb192/itr-wala.git}
      - TARGET_BRANCH=${TARGET_BRANCH:-main}
      - GIT_USER_NAME=${GIT_USER_NAME:-TaxSarthi Automation}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-automation@taxsarthi.local}
      - DRY_RUN=${DRY_RUN:-true}
      - WORKSPACE_DIR=/automation/workspace
    volumes:
      - ./workspace:/automation/workspace
      - ../:/automation/source_project:ro
    restart: "no"
