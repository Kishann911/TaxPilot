services:
  taxpilot-automation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taxpilot-automation
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - TARGET_REPO=${TARGET_REPO:-https://github.com/Kishann911/TaxSarthi-.git}
      - TARGET_BRANCH=${TARGET_BRANCH:-main}
      - GIT_USER_NAME=${GIT_USER_NAME:-Kishan Ojha (TaxPilot Automation)}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-kishanojha462@gmail.com}
      - DRY_RUN=${DRY_RUN:-true}
      - WORKSPACE_DIR=/automation/workspace
    volumes:
      - ./workspace:/automation/workspace
      - ../:/automation/source_project:ro
    restart: "no"
