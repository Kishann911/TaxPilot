<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="100%" height="100%">
  <defs>
    <linearGradient id="taxsarthi-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="taxsarthi-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Brand Emblem (Shield + Rupee + Compass Chariot) -->
  <g transform="translate(10, 8)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#taxsarthi-grad)" />
    <!-- Shield Outline Overlay -->
    <path d="M32 12 L48 20 C48 36 32 48 32 52 C32 48 16 36 16 20 Z" fill="rgba(255,255,255,0.12)" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Stylized Indian Rupee + Forward Navigation Needle -->
    <path d="M25 24 H39 M25 29 H36 M25 24 V38 C28 38 34 37 34 32 C34 27 28 27 25 27 M30 36 L39 48" 
          stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="39" cy="20" r="3.5" fill="#F59E0B" filter="url(#glow)"/>
  </g>

  <!-- Typography -->
  <g transform="translate(90, 48)">
    <text font-family="'Inter', -apple-system, system-ui, sans-serif" font-weight="800" font-size="34" letter-spacing="-0.03em" fill="#0F172A">
      Tax<tspan fill="#0D9488">Sarthi</tspan>
    </text>
    <text x="175" y="-14" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#0D9488" letter-spacing="0.05em">
      AY 2026-27
    </text>
    <text x="2" y="16" font-family="'Inter', -apple-system, system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#64748B" letter-spacing="0.01em">
      Deterministic Indian Tax Co-Pilot
    </text>
  </g>
</svg>
