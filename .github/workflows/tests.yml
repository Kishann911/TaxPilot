name: TaxPilot CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-suite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install TaxPilot Package
        run: |
          pip install -e .
      
      - name: Run Golden Test Suite (51 Cases)
        run: python3 skills/taxpilot/scripts/test_tax_engine.py
      
      - name: Run Input Validator Test Suite (104 Cases)
        run: python3 skills/taxpilot/scripts/test_validate_income.py
      
      - name: Run Extraction Tooling Test Suite (50 Cases)
        run: python3 skills/taxpilot/scripts/test_extraction.py
      
      - name: Run Deterministic Property Fuzzer (3,000 Cases)
        run: python3 -m taxpilot.cli.main fuzz --cases 3000 --seed 42
      
      - name: Validate Example Income JSON & TaxPilot CLI
        run: |
          python3 -m taxpilot.cli.main validate skills/taxpilot/assets/example-income.json
          python3 -m taxpilot.cli.main compute skills/taxpilot/assets/example-income.json > /dev/null
          python3 -m taxpilot.cli.main selftest

  nextjs-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Run TypeScript Engine Parity Tests
        run: npm run test:engine
      - name: Run Next.js Serverless API Endpoint Tests
        run: npm run test:api
      - name: TypeScript Typecheck
        run: npm run typecheck
      - name: Build Next.js Production App
        run: npm run build


