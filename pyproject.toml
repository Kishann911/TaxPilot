[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "taxpilot"
version = "1.0.0"
description = "TaxPilot - Deterministic Indian Income Tax Return (ITR) Engine & AI Co-Pilot for AY 2026-27"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Kishan Ojha", email = "kishanojha462@gmail.com" }
]
keywords = ["tax", "income-tax", "india", "itr", "itr-1", "itr-2", "itr-4", "form-16", "ais", "tax-calculator"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
taxpilot = "taxpilot.cli.main:main"
taxsarthi = "taxpilot.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["taxpilot*"]
